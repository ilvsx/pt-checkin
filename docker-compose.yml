services:
  pt-checkin:
    # CI 构建好的多架构镜像（linux/amd64 + linux/arm64）
    #   使用预构建镜像：docker compose pull && docker compose up -d
    #   本地自行构建：  docker compose up -d --build
    image: ghcr.io/ilvsx/pt-checkin:latest
    build:
      context: .
    container_name: pt-checkin
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # 数据目录（数据库、配置、加密密钥）必须持久化
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      PTCHECKIN_HOST: 0.0.0.0
      PTCHECKIN_PORT: "8787"
      # 暴露到公网/局域网时强烈建议设置访问令牌
      # PTCHECKIN_TOKEN: "change-me"
