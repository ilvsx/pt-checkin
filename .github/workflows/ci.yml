name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装可选依赖 (cryptography)
        run: python -m pip install --upgrade pip cryptography

      - name: 运行单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: CLI 自检
        run: |
          set -euo pipefail
          python run.py doctor --data /tmp/ptcheckin-ci
          # 空数据目录下 status 返回非 0 属于预期
          python run.py status --data /tmp/ptcheckin-ci || true
          # 端到端验证 curl 解析（使用占位符 Cookie）
          python run.py curl --data /tmp/ptcheckin-ci \
            "curl 'https://hhanclub.net/attendance.php' -b 'c_secure_uid=MTIzNDU%3D; c_secure_pass=0123456789abcdef0123456789abcdef'" \
            | grep -q '"cookie_valid": true'
          # 两种参数顺序都应可用
          python run.py --data /tmp/ptcheckin-ci doctor > /dev/null
          echo "✅ CLI 自检通过"

  secret-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确认 data/ 与密钥未被提交
        run: |
          set -euo pipefail
          fail=0
          if git ls-files | grep -qE '^(data/|\.probe/)'; then
            echo "::error::data/ 或 .probe/ 下的文件被提交了，其中包含 Cookie 与加密密钥"
            git ls-files | grep -E '^(data/|\.probe/)'
            fail=1
          fi
          if git ls-files | grep -qE 'secret\.key$|\.db$|\.db-wal$'; then
            echo "::error::发现被提交的密钥或数据库文件"
            git ls-files | grep -E 'secret\.key$|\.db$|\.db-wal$'
            fail=1
          fi
          exit $fail

      - name: 扫描硬编码的真实 Cookie
        run: |
          set -euo pipefail
          # 只放行明确已知的占位符；真实值一旦出现立即失败
          allow_pass='0123456789abcdef0123456789abcdef'
          allow_uid='MTIzNDU%3D'
          fail=0

          echo "── c_secure_pass（真实值为 32 位十六进制）──"
          while read -r v; do
            [ -z "$v" ] && continue
            if [ "$v" != "$allow_pass" ]; then
              echo "::error::疑似真实 c_secure_pass: $v"
              fail=1
            fi
          done < <(grep -rhoE 'c_secure_pass=[0-9a-fA-F]{32}' \
                     --exclude-dir=.git --exclude-dir=.github --exclude-dir=__pycache__ -I . | cut -d= -f2 | sort -u)

          echo "── c_secure_uid（真实值为 URL 编码的 base64，长度 ≥ 8）──"
          while read -r v; do
            [ -z "$v" ] && continue
            if [ "$v" != "$allow_uid" ]; then
              echo "::error::疑似真实 c_secure_uid: $v"
              fail=1
            fi
          done < <(grep -rhoE 'c_secure_uid=[A-Za-z0-9%+/=]{8,}' \
                     --exclude-dir=.git --exclude-dir=.github --exclude-dir=__pycache__ -I . | cut -d= -f2 | sort -u)

          # 其他形态的会话 Cookie（如 QingWa 的 qw_session、PHPSESSID）。
          # 仅 c_secure_* 的检查会漏掉这类站点，因此必须单独覆盖。
          echo "── 其他会话 Cookie（qw_session / PHPSESSID / session 等）──"
          allow_session='00000000-0000-0000-0000-000000000000'
          while read -r entry; do
            [ -z "$entry" ] && continue
            value="${entry#*=}"
            if [ "$value" != "$allow_session" ]; then
              echo "::error::疑似真实会话 Cookie: $entry"
              fail=1
            fi
          done < <(grep -rhoE '[A-Za-z_]*(session|sess|sid|token|auth)[A-Za-z_]*=[A-Za-z0-9%._~-]{8,}' \
                     --exclude-dir=.git --exclude-dir=.github --exclude-dir=__pycache__ -I . \
                   | sort -u | sed -E 's/^[;"'"'"'[:space:]]*//')

          if [ "$fail" -ne 0 ]; then
            echo "请改用占位符，并确认未把真实 Cookie 提交进仓库。"
            exit 1
          fi
          echo "✅ 未发现硬编码的真实 Cookie"
